<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | Stackly Academy</title>
<meta name="description" content="Create account to Stackly Academy.">
<link rel="icon" href="logo-light.webp" type="image/webp">
<link rel="preload" href="libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="sr" href="#main">Skip to content</a><div class="auth-top"><a class="brand" href="index.html" data-splash aria-label="Stackly Academy home"><img src="logo-light.webp" alt="Stackly" width="137" height="40"></a></div><div class="splash" id="splash" hidden><img src="logo-light.webp" alt="Stackly" width="137" height="40"></div><main id="main" class="auth">
  <div class="auth__form"><div class="auth__card"><div class="book__bar" style="margin-bottom:24px"><strong>Stackly Academy</strong><span>Create account</span></div>
    <p class="eyebrow">Join us</p><p class="kicker">Takes about two minutes</p>
    <h1>Create account <em class="acc">and start your application</em></h1>
    <form class="form" data-validate="signup" data-terms="1" aria-label="Create account">
      <div class="field roles-wrap"><span class="lbl" id="role-l">I am a</span><div class="roles" role="radiogroup" aria-labelledby="role-l"><label class="role" for="role-student"><input type="radio" id="role-student" name="role" value="student" data-v="radio"><span class="role__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></span><span class="role__t">Student</span><span class="role__s">Classes, projects and fees</span></label><label class="role" for="role-staff"><input type="radio" id="role-staff" name="role" value="staff" data-v="radio"><span class="role__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><span class="role__t">Staff</span><span class="role__s">Batches, enrolments and enquiries</span></label></div></div>
      <div class="form__row"><div class="field"><label for="first">First name</label><input class="inp" id="first" name="first" type="text" data-v="name" maxlength="16" autocomplete="given-name"></div><div class="field"><label for="last">Last name</label><input class="inp" id="last" name="last" type="text" data-v="name" maxlength="16" autocomplete="family-name"></div></div>
      <div class="form__row"><div class="field"><label for="email">Email</label><input class="inp" id="email" name="email" type="email" data-v="email" maxlength="64" autocomplete="email"></div><div class="field"><label for="phone">Phone</label><input class="inp" id="phone" name="phone" type="tel" data-v="phone" maxlength="10" autocomplete="tel-national" inputmode="numeric"></div></div>
      <div class="field"><label for="s-course">Course of interest</label><select class="inp" id="s-course" name="course" data-v="select"><option value="">Choose a course</option><option value="fullstack">Full-Stack Web Development</option><option value="java">Java Backend Engineering</option><option value="cloud">Cloud and DevOps</option><option value="uiux">UI/UX Design</option><option value="data">Data Analytics with Python</option><option value="marketing">Digital Marketing</option></select></div>
      <div class="form__row"><div class="field"><label for="password">Password</label><div class="pw"><input class="inp" id="password" name="password" type="password" data-v="password" maxlength="32" autocomplete="new-password"><button class="pw__t" type="button" aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="field"><label for="confirm">Confirm password</label><div class="pw"><input class="inp" id="confirm" name="confirm" type="password" data-v="confirm" maxlength="32" autocomplete="new-password"><button class="pw__t" type="button" aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div></div>
      <div class="field"><label class="check" for="terms"><input type="checkbox" id="terms" name="terms" required><span class="box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M3 8.5l3.2 3L13 5"/></svg></span><span class="txt">I accept the <a href="404.html">terms</a> and <a href="404.html">privacy policy</a></span></label></div>
      <button class="btn btn--solid" type="submit" style="width:100%">Create account</button>
    </form>
    <p class="auth__alt">Already have an account? <a class="inline-link" href="signin.html">Sign in</a></p></div></div>
  <div class="auth__media"><img src="auth-signup.webp" alt="A smiling learner with a backpack walking with two friends through a stone hallway" fetchpriority="high"><p class="auth__quote">Nine of our first twenty-two learners now teach here.</p></div>
</main>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-t"><div class="modal__box"><h2 id="modal-t">Notice</h2><p></p><button class="btn btn--solid" type="button">OK</button></div></div>
<script src="script.js"></script>
</body>
</html>
